# Integracion continua del backend de ElectroCorp (Sprint 3, T-19).
# Compila el proyecto y ejecuta las pruebas unitarias, de integracion y de aceptacion (Cucumber)
# en cada push a main, develop o ramas feature/*, y en cada pull request hacia main o develop.
# Los reportes de Surefire se conservan como artefacto de cada ejecucion.

name: CI

on:
  push:
    branches: [ main, develop, "feature/**", "release/**", "hotfix/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener el codigo del commit
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B -ntp verify

      - name: Conservar los reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Resumen de pruebas
        if: always()
        run: |
          echo "## Resultado de las pruebas" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run:" target/surefire-reports/*.txt | tail -n 30 >> "$GITHUB_STEP_SUMMARY" || true
