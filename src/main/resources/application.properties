spring.application.name=electrocorp-platform

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/electrocorp_db}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.naming.physical-strategy=com.electrocorp.electrocorpplatform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.jackson.time-zone=America/Lima

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Redis: cache del resumen de consumo (QA-02). Si Redis no responde, el panel sigue sin cache.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false

electrocorp.energy.summary-cache.enabled=${ENERGY_SUMMARY_CACHE_ENABLED:true}
electrocorp.energy.summary-cache.ttl-seconds=30

# Tarifa electrica en soles por kWh usada por TariffProvider (QA-06).
electrocorp.energy.tariff-per-kwh=${ENERGY_TARIFF_PER_KWH:0.75}
